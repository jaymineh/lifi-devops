name: CI/CD Pipeline

on:
    push:
        branches: [main]
        paths:
            - 'bird/**'
            - 'birdImage/**'
            - 'iac/**'
            - 'helm-charts/**'
            - '.github/workflows/**'

env:
    DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
    AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    AWS_REGION: your-aws-region
    EC2_IP: ${{ secrets.EC2_IP }}
    SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}

jobs:
    security-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Golang codescan with Gosec
              uses: securego/gosec@master
              continue-on-error: true
              with:
                args: './bird/... ./birdImage/...'

            - name: Terraform codescan with tfsec
              uses: aquasecurity/tfsec-action@v1.0.0
              continue-on-error: true
              with:
                args: './iac/...'

    determine-changes:
        needs: security-scan
        runs-on: ubuntu-latest
        outputs:
            bird-api: ${{ steps.check-bird-api.outputs.changed }}
            birdimage-api: ${{ steps.check-birdimage-api.outputs.changed }}
        steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 2

            - name: Check for changes
              id: check_changes
              run: |
                git diff --name-only HEAD^ HEAD > changes.txt
                echo "bird-api=$(grep -q 'bird/' changes.txt && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT
                echo "birdimage-api=$(grep -q 'birdImage/' changes.txt && echo 'true' || echo 'false')" >> $GITHUB_OUTPUT

    build-and-push-image:
        needs: determine-changes
        runs-on: ubuntu-latest
        strategy:
            matrix:
                api: ['bird-api', 'birdimage-api']
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v2

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2

            - name: Login to Docker Hub
              uses: docker/login-action@v2
              with:
                username: ${{ env.DOCKERHUB_USERNAME }}
                password: ${{ env.DOCKERHUB_TOKEN }}

            - name: Build and Push
              uses: docker/build-push-action@v4
              if: |
                (matrix.api == 'bird-api' && needs.determine-changes.outputs.bird-api == 'true') ||
                (matrix.api == 'birdimage-api' && needs.determine-changes.outputs.birdimage-api == 'true')
              with:
                context: ./${{ matrix.api }}-api
                push: true
                tags: ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.api }}-api:${{ github.sha }}

    deploy:
        needs: [build-and-push-image, determine-changes]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Download built APIs
              uses: actions/download-artifact@v3
              with:
                name: built-apis

            - name: Update Helm charts
              run: |
                if [ -f built-apis.txt ]; then
                    while read -r api; do
                        values_file=
                        image_tag="${{ github.sha }}"
                        yq eval ".image.tag = \"$image_tag\"" -i $values_file
                        yq eval ".image.repository = \"${{ env.DOCKERHUB_USERNAME }}/$api\"" -i $values_file
                    done < built-apis.txt
                fi



            
