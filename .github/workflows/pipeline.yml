name: CI/CD Pipeline

on:
    push:
        branches: [main]
        paths:
            - 'bird/**'
            - 'birdImage/**'
            - 'iac/**'
            - 'helm-charts/**'
            - '.github/workflows/**'

env:
    DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    ARGOCD_SERVER: ${{ secrets.ARGOCD_SERVER }}
    ARGOCD_TOKEN: ${{ secrets.ARGOCD_TOKEN }}

jobs:
    security-scan:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Golang codescan with Gosec
              uses: securego/gosec@master
              continue-on-error: true
              with:
                args: './bird/... ./birdImage/...'

            - name: Terraform codescan with tfsec
              uses: aquasecurity/tfsec-action@v1.0.0
              continue-on-error: true
              with:
                args: './iac/...'

    determine-changes:
        needs: security-scan
        runs-on: ubuntu-latest
        outputs:
            birdapi_changed: ${{ steps.check_changes.outputs.birdapi_changed }}
            birdimageapi_changed: ${{ steps.check_changes.outputs.birdimageapi_changed }}
        steps:
            - uses: actions/checkout@v4
              with:
                fetch-depth: 2

            - name: Check for changes
              id: check_changes
              run: |
                git diff --name-only HEAD^ HEAD > changes.txt
                birdapi_changed=$(grep -q 'bird/' changes.txt && echo 'true' || echo 'false')
                birdimageapi_changed=$(grep -q 'birdImage/' changes.txt && echo 'true' || echo 'false')
                echo "birdapi_changed=$birdapi_changed" >> $GITHUB_OUTPUT
                echo "birdimageapi_changed=$birdimageapi_changed" >> $GITHUB_OUTPUT

    build-and-push:
        needs: determine-changes
        runs-on: ubuntu-latest
        strategy:
            matrix:
                api: ['bird', 'birdImage']
        if: |
          (matrix.api == 'bird' && needs.determine-changes.outputs.birdapi_changed == 'true') ||
          (matrix.api == 'birdImage' && needs.determine-changes.outputs.birdimageapi_changed == 'true')
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Set up QEMU
              uses: docker/setup-qemu-action@v2
              if: |
                (matrix.api == 'bird' && needs.determine-changes.outputs.birdapi_changed == 'true') ||
                (matrix.api == 'birdImage' && needs.determine-changes.outputs.birdimageapi_changed == 'true')

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v2
              if: |
                (matrix.api == 'bird' && needs.determine-changes.outputs.birdapi_changed == 'true') ||
                (matrix.api == 'birdImage' && needs.determine-changes.outputs.birdimageapi_changed == 'true')

            - name: Login to Docker Hub
              uses: docker/login-action@v2
              if: |
                (matrix.api == 'bird' && needs.determine-changes.outputs.birdapi_changed == 'true') ||
                (matrix.api == 'birdImage' && needs.determine-changes.outputs.birdimageapi_changed == 'true')
              with:
                username: ${{ env.DOCKERHUB_USERNAME }}
                password: ${{ env.DOCKERHUB_TOKEN }}

            - name: Build and Push
              if: |
                (matrix.api == 'bird' && needs.determine-changes.outputs.birdapi_changed == 'true') ||
                (matrix.api == 'birdImage' && needs.determine-changes.outputs.birdimageapi_changed == 'true')
              env:
                IMAGE_TAG: ${{ github.sha }}
              run: |
                cd ${{ matrix.api }}
                docker build -t ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.api }}:$IMAGE_TAG .
                docker push ${{ env.DOCKERHUB_USERNAME }}/${{ matrix.api }}:$IMAGE_TAG

    deploy:
        needs: [build-and-push, determine-changes]
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install yq
              run: |
                wget https://github.com/mikefarah/yq/releases/download/v4.40.5/yq_linux_amd64 -O /usr/local/bin/yq
                chmod +x /usr/local/bin/yq

            - name: Update Helm chart values
              if: |
                needs.determine-changes.outputs.birdapi_changed == 'true' ||
                needs.determine-changes.outputs.birdimageapi_changed == 'true'
              run: |

                if [[ "${{ needs.determine-changes.outputs.birdapi_changed }}" == "true" ]]; then
                    # Update the image tag in the Helm values
                    yq eval '.image.tag = "${{ github.sha }}"' -i helm-charts/birdapi/values.yaml
                    git add helm-charts/birdapi/values.yaml
                fi


                if [[ "${{ needs.determine-changes.outputs.birdimageapi_changed }}" == "true" ]]; then
                    # Update the image tag in the Helm values
                    yq eval '.image.tag = "${{ github.sha }}"' -i helm-charts/birdimageapi/values.yaml
                    git add helm-charts/birdimageapi/values.yaml
                fi

            - name: Commit and push changes
              run: |
                if [[ -n "$(git status --porcelain)" ]]; then
                    git config --global user.name 'GitHub Actions'
                    git config --global user.email 'github-actions@github.com'
                    git commit -m "Update image tags to ${{ github.sha }}"
                    git push
                fi


